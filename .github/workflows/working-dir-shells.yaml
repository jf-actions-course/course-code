name: Working Directory and Shells
on: [push]

jobs:
    display-wd-linux:
        runs-on: ubuntu-latest
        steps:
            - name: Displaying the working directory & list files
              run: |
                pwd
                ls -a
                echo $GITHUB_SHA
                echo $GITHUB_REPOSITORY
                echo $GITHUB_WORKSPACE
        display-wd-windows:
        runs-on: windows-latest
        steps:
            - name: Displaying the working directory & list files
              run: |
                pwd
                ls -a
                echo $GITHUB_SHA
                echo $GITHUB_REPOSITORY
                echo $GITHUB_WORKSPACE